name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept licenses & install SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -1)"
          echo "Using sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace --no-configuration-cache --refresh-dependencies \
            || { echo "retrying after transient resolution failure"; sleep 5; \
                 gradle :app:assembleDebug --no-daemon --stacktrace --no-configuration-cache; }

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --no-configuration-cache

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bmwdrive-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to 'latest' release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk bmwdrive-debug.apk
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest bmwdrive-debug.apk \
            --title "BMWDrive debug (latest)" \
            --notes "Debug APK built from ${{ github.sha }}. On the phone, open this page, download the .apk and allow installs from unknown sources." \
            --prerelease
